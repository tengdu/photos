name: Build gallery

on:
  push:
    branches: [main]
    paths:
      - 'photos/**'
      - 'scripts/**'
      - 'assets/**'
      - 'site/**'
      - 'package*.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A burst of uploads (one commit per photo) queues up; only the latest pending run is kept.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install HEIC decoder
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libheif-examples libheif-plugin-libde265

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Restore processed images
        uses: actions/cache@v4
        with:
          path: .cache
          key: img-${{ github.run_id }}
          restore-keys: img-

      - run: node scripts/build.mjs
        env:
          # "lat,lon,radius_m; …" — photos within these areas are left off the map.
          PRIVACY_ZONES: ${{ secrets.PRIVACY_ZONES }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
