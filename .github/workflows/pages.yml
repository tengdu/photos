name: Build gallery

on:
  push:
    branches: [main]
    paths:
      - 'photos/**'
      - 'scripts/**'
      - 'assets/**'
      - 'site/**'
      - 'package*.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write # read photos/; delete files of deleted videos from the "media" release
  pages: write
  id-token: write

# Every uploaded file is its own commit, so a batch of photos starts one run per file. Each new
# run cancels the one before it, and a run only builds once 20 seconds have passed without a
# newer upload, so a whole batch is built and deployed once, right after its last upload.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # In the background, while the next steps set up: none of this waits for apt.
      - name: Install the HEIC decoder
        run: |
          date +%s > /tmp/started
          pkgs="libheif-examples libheif-plugin-libde265"
          ( sudo apt-get install -y -q --no-install-recommends $pkgs \
              || { sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends $pkgs; }
            echo $? > /tmp/heif-done ) < /dev/null > /tmp/heif.log 2>&1 &

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Restore processed images
        uses: actions/cache@v4
        with:
          path: .cache
          key: img-${{ github.run_id }}
          restore-keys: img-

      - name: Wait for more uploads
        run: |
          left=$(( $(cat /tmp/started) + 20 - $(date +%s) ))
          if [ "$left" -gt 0 ]; then sleep "$left"; fi
          for i in $(seq 120); do [ -e /tmp/heif-done ] && break; sleep 1; done
          if [ "$(cat /tmp/heif-done 2>/dev/null)" != 0 ]; then cat /tmp/heif.log; echo "::warning::Installing the HEIC decoder failed"; fi

      - run: node scripts/build.mjs
        env:
          # "lat,lon,radius_m; …" — photos within these areas are left off the map.
          PRIVACY_ZONES: ${{ secrets.PRIVACY_ZONES }}
          # Lists the videos in the "media" release.
          GITHUB_TOKEN: ${{ github.token }}
          # ffmpeg makes the preview of a new video; installed only when one needs it.
          FFMPEG_INSTALL: >-
            sudo apt-get install -y -q --no-install-recommends ffmpeg
            || { sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg; }

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
