name: Build gallery

on:
  push:
    branches: [main]
    paths:
      - 'photos/**'
      - 'scripts/**'
      - 'assets/**'
      - 'site/**'
      - 'package*.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Every uploaded file is its own commit, so a batch of photos starts one run per file.
  # Each run first waits for the uploads to stop. A newer run cancels older runs that are
  # still waiting, so the whole batch is built once, after the last upload.
  wait:
    runs-on: ubuntu-latest
    concurrency:
      group: pages-wait
      cancel-in-progress: true
    steps:
      - name: Wait for more uploads
        run: sleep 60

  build:
    needs: wait
    runs-on: ubuntu-24.04
    # One build/deploy at a time; a newer pending run replaces an older pending one.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install HEIC decoder
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libheif-examples libheif-plugin-libde265

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Restore processed images
        uses: actions/cache@v4
        with:
          path: .cache
          key: img-${{ github.run_id }}
          restore-keys: img-

      - run: node scripts/build.mjs
        env:
          # "lat,lon,radius_m; …" — photos within these areas are left off the map.
          PRIVACY_ZONES: ${{ secrets.PRIVACY_ZONES }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
