<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Photos</title>
<meta name="description" content="Photo library">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Photos">
<link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin>
<link rel="preload" href="__PHOTOS__" as="fetch" crossorigin data-photos>
<link rel="stylesheet" href="__CSS__">
<script type="module" src="__JS__"></script>
</head>
<body>
<header class="top">
  <div class="top-text">
    <h1 id="title">Photos</h1>
    <p id="subtitle"></p>
  </div>
  <div id="zoom" class="zoom" hidden>
    <button type="button" data-step="1" aria-label="Smaller thumbnails">−</button>
    <button type="button" data-step="-1" aria-label="Larger thumbnails">+</button>
  </div>
</header>
<main id="view" class="view"></main>
<div id="mapview" class="mapview" hidden></div>
<nav id="dock" class="dock" aria-label="Views">
  <div class="seg">
    <a href="#/years" data-view="years">Years</a>
    <a href="#/months" data-view="months">Months</a>
    <a href="#/days" data-view="days">Days</a>
    <a href="#/all" data-view="all">All Photos</a>
  </div>
  <a href="#/map" data-view="map" class="dock-map" aria-label="Map" title="Map"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M9 4 3.5 6v14L9 18l6 2 5.5-2V4L15 6 9 4Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 4v14M15 6v14" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></a>
</nav>
</body>
</html>
